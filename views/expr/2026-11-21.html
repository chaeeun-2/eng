<style>
  :root{--bg:#f7f8f3;--card:#fff;--ink:#1f2a1c;--sub:#6b7566;--lime:#7cb342;--lime-d:#558b2f;--hl:#eaf5d6;--line:#e3e7dc}
  @media (prefers-color-scheme:dark){:root{--bg:#141712;--card:#1d211a;--ink:#e8eee2;--sub:#9aa591;--lime:#9ccc65;--lime-d:#c5e1a5;--hl:#2c3a1f;--line:#2e3428}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;line-height:1.55}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:20px;margin:0 0 10px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
  .bar label{color:var(--sub)}
  select,button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
  button.main{background:var(--lime);border-color:var(--lime);color:#fff;font-weight:600}
  button.on{background:var(--hl);border-color:var(--lime)}
  main{padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
  .card.playing{border-color:var(--lime);box-shadow:0 0 0 3px var(--hl)}
  .top{display:flex;gap:10px;align-items:baseline}
  .id{font-weight:700;color:var(--lime-d);min-width:34px}
  .sit{font-weight:600}
  .said{color:var(--sub);font-size:14px;margin:4px 0 12px 44px}
  .row{display:flex;gap:10px;align-items:flex-start;margin:8px 0 0 44px}
  .row .t{flex:1}
  .en{font-size:19px;font-weight:600}
  .ex .en{font-size:16px;font-weight:500}
  .ko{color:var(--sub);font-size:14px}
  .hideko .ko{filter:blur(5px);cursor:pointer}
  .hideko .ko.show{filter:none}
  mark{background:var(--hl);color:inherit;padding:0 3px;border-radius:4px;border-bottom:2px solid var(--lime)}
  .play{flex:none;width:34px;height:34px;border-radius:50%;padding:0;font-size:14px}
  .note{margin:12px 0 0 44px;font-size:14px;background:var(--hl);border-radius:8px;padding:8px 12px}
  .speaking{background:var(--hl);border-radius:6px}
  .nav{color:inherit;text-decoration:none;opacity:.6;margin-right:8px}
  @media (max-width:560px){main{padding:12px}.card{padding:14px}.said,.row,.note{margin-left:0}.en{font-size:17px}.ex .en{font-size:15px}header{padding:10px 12px}}
  footer{color:var(--sub);font-size:13px;text-align:center;padding:10px 20px 40px}

<script>
const DATA = [{"id": "E1", "situation": "작업을 다시 돌렸는데 결과가 그대로일 때", "said_ko": "다시 돌렸는데, 결과가 제대로 안 바뀐 것 같아", "source": "11-19", "en": "I re-ran it, but the result doesn't seem to have changed.", "examples": [{"en": "I re-ran the batch with the new order, but the output doesn't seem to have changed. Could you take a look?", "ko": "새 순서로 배치를 다시 돌렸는데 결과가 안 바뀐 것 같아요. 한번 봐 주시겠어요?"}, {"en": "We re-ran the process yesterday, but the numbers don't seem to have changed much.", "ko": "어제 공정을 다시 돌렸는데 수치가 별로 안 바뀐 것 같습니다."}], "note": "단정하지 않고 '안 바뀐 것 같다'고 말할 때 씁니다. 문제를 부드럽게 보고할 때 좋습니다.", "key": ["doesn't seem to have changed", "don't seem to have changed"]}, {"id": "E2", "situation": "계획만 세우고 실제 만들기는 미룰 때", "said_ko": "계획만 작성해 놓고 실제로 제작하지는 말아줘", "source": "11-17", "en": "For now, let's just draft the plan and hold off on building it.", "examples": [{"en": "Let's draft the plan first and hold off on building anything until we're aligned.", "ko": "합의될 때까지 만들기는 보류하고, 계획부터 초안으로 쓰죠."}, {"en": "I'd like us to hold off on the implementation until the scope is confirmed.", "ko": "범위가 확정될 때까지 구현은 보류했으면 합니다."}], "note": "실행을 멈춰 달라고 할 때 씁니다. 'hold off on' 뒤에는 동사 ing 형태나 명사를 씁니다.", "key": ["hold off on"]}, {"id": "E3", "situation": "작업이 실제로 돌고 있는지 확인을 부탁할 때", "said_ko": "분석이 제대로 돌고 있는 게 맞지?", "source": "11-17", "en": "Can you confirm the analysis is actually running as expected?", "examples": [{"en": "Can you confirm the job is actually running as expected before we move on?", "ko": "다음으로 넘어가기 전에 작업이 실제로 예상대로 돌고 있는지 확인해 줄래요?"}, {"en": "Could you confirm that the pipeline is running as expected on your side?", "ko": "그쪽에서 파이프라인이 예상대로 돌고 있는지 확인 부탁드립니다."}], "note": "confirm은 사실 확인을 부탁할 때, actually는 겉보기가 아닌 실제 상태를 물을 때 씁니다.", "key": ["confirm", "running as expected"]}, {"id": "E4", "situation": "수정 사항을 부담 없이 전달할 때", "said_ko": "수정사항이야. '재료'는 삭제해도 됨", "source": "11-15", "en": "Here are my revision notes. Feel free to drop the materials section.", "examples": [{"en": "Here are my revision notes. Feel free to drop the second section if it doesn't add value.", "ko": "수정 사항 정리했습니다. 가치가 없으면 두 번째 섹션은 빼도 됩니다."}, {"en": "Overall, the structure works, but feel free to simplify the intro.", "ko": "전체 구조는 괜찮은데, 도입부는 간단히 줄여도 좋겠습니다."}], "note": "'feel free to'는 명령이 아니라 선택지를 줄 때 씁니다. 피드백을 부담 없이 전할 수 있습니다.", "key": ["Feel free to", "feel free to"]}, {"id": "E5", "situation": "할 일의 순서를 정할 때", "said_ko": "못 끝낸 일 중요도 순위로 나래비해줘", "source": "11-18", "en": "Could you rank these by priority?", "examples": [{"en": "Could you rank these by priority so we know what to tackle first?", "ko": "무엇부터 할지 알 수 있게 우선순위대로 정리해 줄 수 있을까요?"}, {"en": "Let's rank the open items by priority and pick the top three for this week.", "ko": "미완료 항목을 우선순위대로 정하고 이번 주 상위 3개를 고르죠."}], "note": "여러 일 중 순서를 정할 때 씁니다. 'by priority'가 '중요도 순으로'라는 뜻입니다.", "key": ["rank these by priority", "by priority"]}, {"id": "E6", "situation": "반대 의견을 부드럽게 꺼낼 때", "said_ko": "중요한 고민이 있어. 이 방식이 사용자를 제한하기도 해", "source": "11-10", "en": "I have a concern that this approach could limit how users work.", "examples": [{"en": "I have a concern that a fixed screen flow could limit how creators work outside the app.", "ko": "화면 흐름을 고정하면 작업자가 앱 밖에서 일하는 방식을 제한할 수 있어 걱정입니다."}, {"en": "I have a concern about the timeline, but I think we can make it work with a smaller scope.", "ko": "일정이 걱정되지만, 범위를 줄이면 가능할 것 같습니다."}], "note": "바로 'No'라고 하지 않고 걱정을 먼저 말해서 반대 의견을 완곡하게 시작할 때 씁니다.", "key": ["I have a concern"]}, {"id": "E7", "situation": "과정과 결과를 글로 정리해 공유할 때", "said_ko": "오늘 한 실험의 과정과 결과를 리포트로 남겨줘", "source": "11-15", "en": "Could you write up the process and results as a short report?", "examples": [{"en": "I'll write up the experiment results and share them with the team by Friday.", "ko": "실험 결과를 정리해서 금요일까지 팀에 공유하겠습니다."}, {"en": "Could you write up what we tried and what worked, so others can follow it?", "ko": "무엇을 시도했고 무엇이 됐는지 다른 사람이 따라 할 수 있게 정리해 줄 수 있을까요?"}], "note": "과정과 결과를 글로 정리할 때 씁니다. 'make a report'보다 '정리해서 쓰다' 느낌이 강합니다.", "key": ["write up"]}, {"id": "E8", "situation": "조건을 달고 그대로 진행할 때", "said_ko": "충돌이 없으면 그대로 지침에 적용해줘", "source": "11-13", "en": "If there are no conflicts, let's go ahead and apply it as is.", "examples": [{"en": "If there are no conflicts with the current guidelines, we can apply it as is.", "ko": "현재 지침과 충돌이 없으면 그대로 적용해도 됩니다."}, {"en": "If the test results look fine, let's ship it as is and fix the rest later.", "ko": "테스트 결과가 괜찮으면 지금 상태 그대로 배포하고 나머지는 나중에 고치죠."}], "note": "'~하면 ~하자'처럼 조건을 달아 동의할 때 씁니다. 'as is'는 지금 상태 그대로라는 뜻입니다.", "key": ["as is", "go ahead"]}, {"id": "E9", "situation": "어려운 용어를 쉽게 풀어 달라고 할 때", "said_ko": "타 부서 보고서에 나오는 용어들을 알아듣기 쉽게 정리해줘", "source": "11-13", "en": "Could you explain these terms in plain language?", "examples": [{"en": "Before the meeting, could you explain these metrics in plain language for the team?", "ko": "회의 전에 이 지표들을 팀원들이 알기 쉽게 설명해 줄 수 있을까요?"}, {"en": "I don't know what 'WoW' means here, so could you put it in plain language?", "ko": "여기서 'WoW'가 무슨 뜻인지 모르겠어요. 쉬운 말로 설명해 주실래요?"}], "note": "전문 용어를 쉬운 말로 풀어 달라고 할 때 씁니다. 'in plain language'가 핵심입니다.", "key": ["in plain language"]}, {"id": "E10", "situation": "문제를 말하고 개선안을 부탁할 때", "said_ko": "제대로 거의 작동하지 못하는 것 같아. 개선점을 찾아줘", "source": "11-15", "en": "It's not really working well. Could you suggest some improvements?", "examples": [{"en": "The notification feature isn't working well. Could you suggest some improvements?", "ko": "알림 기능이 제대로 작동하지 않습니다. 개선점을 제안해 주실 수 있을까요?"}, {"en": "Our review process is slow. Could you suggest a few ways to speed it up?", "ko": "검토 과정이 느립니다. 속도를 높일 방법을 몇 가지 제안해 줄 수 있을까요?"}], "note": "문제를 먼저 말하고 해결책을 부탁하는 흐름입니다.", "key": ["suggest some improvements", "Could you suggest"]}];

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(text, keys){
  let h = esc(text);
  for (const k of keys){ const ek = esc(k); if (h.includes(ek)) { h = h.split(ek).join('<mark>'+ek+'</mark>'); break; } }
  return h;
}
const list = document.getElementById('list');
const lines = []; // {text, el, card}
DATA.forEach((d, i) => {
  const c = document.createElement('section'); c.className = 'card';
  c.innerHTML = `<div class="top"><span class="id">${d.id}</span><span class="sit">${esc(d.situation)}</span></div>
    ${d.said_ko ? `<div class="said">내가 쓴 말: “${esc(d.said_ko)}” ${d.source ? `<span style="opacity:.7">(${esc(d.source)})</span>` : ''}</div>` : '<div class="said"></div>'}`;
  const add = (en, ko, cls) => {
    const r = document.createElement('div'); r.className = 'row ' + cls;
    r.innerHTML = `<button class="play" title="듣기">▶</button><div class="t"><div class="en">${hl(en, d.key)}</div>${ko ? `<div class="ko">${esc(ko)}</div>` : ''}</div>`;
    const idx = lines.length; lines.push({text: en, el: r.querySelector('.en'), card: c});
    r.querySelector('.play').onclick = () => playFrom(idx, true);
    r.querySelector('.en').onclick = () => playFrom(idx, true);
    const k = r.querySelector('.ko'); if (k) k.onclick = () => k.classList.toggle('show');
    c.appendChild(r);
  };
  add(d.en, '', 'main');
  d.examples.forEach(e => add(e.en, e.ko, 'ex'));
  const n = document.createElement('div'); n.className = 'note'; n.textContent = '💡 ' + d.note; c.appendChild(n);
  list.appendChild(c);
});

// ---- 목소리 ----
// AUDIO = 문장 → 미리 만든 Google 목소리 녹음. 있으면 휴대폰에서도 같은 목소리로 듣는다.
const AUDIO = {"I re-ran it, but the result doesn't seem to have changed.": "audio/7a545e265894.mp3", "For now, let's just draft the plan and hold off on building it.": "audio/122574b2cb23.mp3", "Can you confirm the analysis is actually running as expected?": "audio/1a9062846be2.mp3", "Here are my revision notes. Feel free to drop the materials section.": "audio/7502c081faa0.mp3", "Could you rank these by priority?": "audio/267a8bd5ffd1.mp3", "I have a concern that this approach could limit how users work.": "audio/2a90c14e6764.mp3", "Could you write up the process and results as a short report?": "audio/b14ba253e79a.mp3", "If there are no conflicts, let's go ahead and apply it as is.": "audio/84be7e35f2ff.mp3", "Could you explain these terms in plain language?": "audio/000b2f0ecf70.mp3", "It's not really working well. Could you suggest some improvements?": "audio/543310a4a88a.mp3", "I re-ran the batch with the new order, but the output doesn't seem to have changed. Could you take a look?": "audio/2e34520d5943.mp3", "We re-ran the process yesterday, but the numbers don't seem to have changed much.": "audio/690e96137897.mp3", "Let's draft the plan first and hold off on building anything until we're aligned.": "audio/2adad7861b0f.mp3", "I'd like us to hold off on the implementation until the scope is confirmed.": "audio/6f8593196b63.mp3", "Can you confirm the job is actually running as expected before we move on?": "audio/5b1fb8eb278a.mp3", "Could you confirm that the pipeline is running as expected on your side?": "audio/8c9c51337157.mp3", "Here are my revision notes. Feel free to drop the second section if it doesn't add value.": "audio/cc0fc6a5d6dc.mp3", "Overall, the structure works, but feel free to simplify the intro.": "audio/d79d6ca97a50.mp3", "Could you rank these by priority so we know what to tackle first?": "audio/104ca4d636da.mp3", "Let's rank the open items by priority and pick the top three for this week.": "audio/fd2990809d07.mp3", "I have a concern that a fixed screen flow could limit how creators work outside the app.": "audio/f5fb015a0e2a.mp3", "I have a concern about the timeline, but I think we can make it work with a smaller scope.": "audio/0f4a23660aa1.mp3", "I'll write up the experiment results and share them with the team by Friday.": "audio/2a652d0a9e96.mp3", "Could you write up what we tried and what worked, so others can follow it?": "audio/7e28ac9a282b.mp3", "If there are no conflicts with the current guidelines, we can apply it as is.": "audio/20c4b58d5b87.mp3", "If the test results look fine, let's ship it as is and fix the rest later.": "audio/de69332501f8.mp3", "Before the meeting, could you explain these metrics in plain language for the team?": "audio/9232e2b9ee7b.mp3", "I don't know what 'WoW' means here, so could you put it in plain language?": "audio/73099fe8516b.mp3", "The notification feature isn't working well. Could you suggest some improvements?": "audio/49bdc1eedfd1.mp3", "Our review process is slow. Could you suggest a few ways to speed it up?": "audio/64c05f2996bd.mp3"};
const HAS_REC = Object.keys(AUDIO).length > 0;
const KEY = 'lime-eng-voice2';
const vSel = document.getElementById('voice');
const PREF = [/Ava.*(Premium|Enhanced)/i, /Samantha.*(Premium|Enhanced)/i, /Zoe.*(Premium|Enhanced)/i, /(Premium|Enhanced)/i, /Google US English/i, /Microsoft (Aria|Jenny).*Online/i, /^Ava/i, /^Samantha/i, /Allison|Susan|Nicky/i];
let voices = [];
function loadVoices(){
  voices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(v => /^en[-_](US|GB|AU|CA|IE)/i.test(v.lang));
  if (!voices.length && !HAS_REC) return;
  const saved = localStorage.getItem(KEY);
  let best = null;
  if (saved !== 'rec') best = voices.find(v => v.name === saved);
  if (!best && !HAS_REC){
    for (const p of PREF){ best = voices.find(v => p.test(v.name) && /en[-_]US/i.test(v.lang)) || voices.find(v => p.test(v.name)); if (best) break; }
    best = best || voices.find(v => /en[-_]US/i.test(v.lang)) || voices[0];
  }
  vSel.innerHTML = (HAS_REC ? `<option value="rec" ${best ? '' : 'selected'}>Google 목소리 (녹음)</option>` : '') +
    voices.map((v, i) => `<option value="${i}" ${v === best ? 'selected' : ''}>${esc(v.name)} (${v.lang})</option>`).join('');
}
loadVoices(); if (window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;
vSel.onchange = () => localStorage.setItem(KEY, vSel.value === 'rec' ? 'rec' : voices[vSel.value].name);

// ---- 읽기 ----
const player = new Audio(); player.preload = 'auto';
let token = 0;
function clearMarks(){ document.querySelectorAll('.speaking').forEach(e => e.classList.remove('speaking')); document.querySelectorAll('.card.playing').forEach(e => e.classList.remove('playing')); }
function stopAll(){ if (window.speechSynthesis) speechSynthesis.cancel(); player.pause(); player.onended = player.onerror = null; }
function speak(text, rate){
  return new Promise(res => {
    if (!window.speechSynthesis) return res();
    const u = new SpeechSynthesisUtterance(text);
    const v = voices[vSel.value]; if (v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
    u.rate = rate; u.onend = u.onerror = res; speechSynthesis.speak(u);
  });
}
function say(text){
  const rate = parseFloat(document.getElementById('rate').value);
  const src = AUDIO[text];
  if (vSel.value !== 'rec' || !src) return speak(text, rate);
  return new Promise(res => {
    player.onended = () => res();
    player.onerror = () => { player.onerror = null; speak(text, rate).then(res); };
    player.src = src; player.playbackRate = rate; player.defaultPlaybackRate = rate;
    const p = player.play(); if (p) p.catch(() => { player.onerror = null; speak(text, rate).then(res); });
  });
}
async function playFrom(idx, single){
  stopAll(); const my = ++token;
  const reps = parseInt(document.getElementById('rep').value);
  for (let i = idx; i < lines.length; i++){
    if (my !== token) return;
    clearMarks(); const L = lines[i]; L.el.classList.add('speaking'); L.card.classList.add('playing');
    L.el.scrollIntoView({block:'center', behavior:'smooth'});
    for (let r = 0; r < reps; r++){ if (my !== token) return; await say(L.text); await new Promise(s => setTimeout(s, 450)); }
    if (single) break;
    await new Promise(s => setTimeout(s, 500));
  }
  if (my === token) clearMarks();
}

document.getElementById('stop').onclick = () => { token++; stopAll(); clearMarks(); };
